# Aruba Central Automation - nginx vhost (self-signed TLS).
#
# install.sh substitutes __SERVER_NAME__ and drops this in
# /etc/nginx/sites-available/. To edit by hand, replace __SERVER_NAME__ with
# your hostname or IP (or "_" to match any).
#
# For a real (trusted) certificate, point ssl_certificate[_key] at your
# Let's Encrypt / ACME paths instead of the self-signed ones below.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate     /etc/ssl/aruba-central-automation/fullchain.pem;
    ssl_certificate_key /etc/ssl/aruba-central-automation/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
